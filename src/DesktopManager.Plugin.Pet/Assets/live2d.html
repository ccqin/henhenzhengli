<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* 立牌风：视口白底无法去除（WebView2 运行时 airspace）→ 做成展示立牌 */
  html { margin: 0; padding: 0; background: linear-gradient(180deg, #4a1015 0%, #2a1518 100%); overflow: hidden; height: 100%; }
  body { margin: 0; padding: 0; height: 100%; position: relative; }
  #stage { width: 100vw; height: 100vh; }
  .plate { position: fixed; inset: 6px; border: 2px solid rgba(90,110,160,0.35); border-radius: 18px; pointer-events: none; }
  .plate::after { content: '◆'; position: absolute; bottom: 8px; right: 14px; color: rgba(90,110,160,0.5); font-size: 12px; }
  #fallback { color: #fff; font-size: 40px; display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div id="stage"></div>
<div class="plate"></div>
<div id="fallback">🐈</div>
<!-- console 转发必须最先（一切诊断依赖它——放在后面=前面的输出全被原生吞，排障弯路元凶） -->
<script>
window.onerror = (m, u, l, c, e) => console.error('JSERR', m, '@', l + ':' + c, e && e.message);
console.error = ((orig) => function (...a) {
  try { window.chrome?.webview?.postMessage({ type: 'console', level: 'error', text: a.map(String).join(' ') }); } catch {}
  orig.apply(console, a);
})(console.error.bind(console));
document.addEventListener('error', (e) => {
  if (e.target.tagName === 'SCRIPT') console.error('SCRIPT LOAD FAIL', e.target.src);
}, true);
</script>
<script src="live2dcubismcore.min.js" onerror="console.error('FAIL core')"></script>
<script src="pixi.min.js" onerror="console.error('FAIL pixi')"></script>
<script src="pixi-live2d-display.min.js" onerror="console.error('FAIL display')"></script>
<script>
  console.error('CHECK: PIXI=' + (typeof PIXI) + ' PIXI.live2d=' + (typeof PIXI !== 'undefined' ? typeof PIXI.live2d : '-') +
    ' Core=' + (typeof Live2DCubismCore !== 'undefined' ? 'ok' : 'MISSING') + ' loc=' + location.href.slice(0, 30));
</script>
<script>
let __started = false;
window.__startPet = async function () {
  if (__started) return; __started = true;
  // NavigateToString 无 query——模型路径由宿主 ExecuteScript 注入 window.__MODEL__
  const modelUrl = window.__MODEL__ || null;

  const app = new PIXI.Application({
    backgroundAlpha: 0, antialias: true,
    resolution: 1, autoDensity: true,
    width: innerWidth, height: innerHeight,
  });
  document.body.appendChild(app.view);   // 自建 canvas（传 div 当 view 行为不定，白屏元凶之一）

  let model = null;
  if (modelUrl && window.PIXI.live2d) {
    try {
      model = await PIXI.live2d.Live2DModel.from(modelUrl);
      app.stage.addChild(model);
      // 模型缩放到取景框（stage 高度的 ~90%）并锚定底部中心（站姿）
      const fit = () => {
        const sc = (innerHeight * 0.9) / (model.internalModel.originalHeight || 1200);
        model.scale.set(sc);
        model.anchor.set(0.5, 0.5);
        model.position.set(innerWidth / 2, innerHeight / 2);
      };
      fit();
      addEventListener('resize', fit);
      // 状态动作映射（宿主 postMessage 的 state → Live2D motion 组名）
      // Mark 模型组：Idle/Tap/FlickDown/FlickUp——walk/drag 用 Tap 池，fall 用 FlickUp，sleep 复用 idle
      const MOTIONS = {
        idle: 'Idle', walk: 'Tap', climb: 'Tap', fall: 'FlickUp',
        drag: 'Tap', sleep: 'Idle', happy: 'FlickDown',
      };
      window.chrome.webview.addEventListener('message', (e) => {
        const m = e.data;
        if (!model) return;
        if (m.type === 'state' && MOTIONS[m.state] && model.internalModel.motionManager) {
          model.internalModel.motionManager.startMotion(MOTIONS[m.state]);
        }
        if (m.type === 'look') {  // 眼神跟随（拖拽/鼠标）
          if (model.focus) model.focus(m.x, m.y);
        }
        if (m.type === 'flip' && model.internalModel) {
          model.scale.x = Math.abs(model.scale.x) * (m.to < 0 ? -1 : 1);
        }
      });
    } catch (err) {
      console.error('live2d load fail', err);
      fallbackEmoji();
    }
  } else fallbackEmoji();

  function fallbackEmoji() {
    document.getElementById('fallback').style.display = 'block';
    window.chrome?.webview?.postMessage({ type: 'renderer', kind: 'fallback' });
  }

  // 告诉宿主渲染器就绪
  window.chrome?.webview?.postMessage({ type: 'renderer', kind: model ? 'live2d' : 'fallback' });

  // 窗口尺寸同步
  addEventListener('resize', () => app.renderer.resize(innerWidth, innerHeight));
};
</script>
</body>
</html>
